name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy -- -D warnings

  build:
    name: Build & Test (Unit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release
      - run: cargo test
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: fehrust-release-binary
          path: target/release/fehrust.exe

  coverage:
    name: Test Coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --all-features --workspace --summary-only
      - name: Generate LCOV artifact
        run: cargo llvm-cov --all-features --workspace --lcov --output-path coverage.lcov
      - uses: actions/upload-artifact@v4
        with:
          name: fehrust-coverage
          path: coverage.lcov

  installer:
    name: Build & Upload Installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fehrust-release-binary
          path: target/release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path LICENSE -PathType Leaf)) {
            throw "LICENSE file is missing."
          }
          $version = (Select-String '^\s*version\s*=' Cargo.toml |
            Select-Object -First 1).Line -replace '.*"([^"]+)".*','$1'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" installer\fehrust.iss
      - name: Upload setup executable
        uses: actions/upload-artifact@v4
        with:
          name: fehrust-windows-x86_64-setup
          path: installer/fehrust-*-windows-x86_64-setup.exe
