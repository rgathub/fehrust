name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy -- -D warnings

  build:
    name: Build & Test (Unit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release
      - run: cargo test
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: fehrust-release-binary
          path: target/release/fehrust.exe

  installer:
    name: Build & Upload Installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fehrust-release-binary
          path: target/release
      - uses: ilammy/setup-innosetup@v2
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String '^\s*version\s*=' Cargo.toml |
            Select-Object -First 1).Line -replace '.*"([^"]+)".*','$1'
          iscc.exe "/DMyAppVersion=$version" installer\fehrust.iss
      - name: Upload setup executable
        uses: actions/upload-artifact@v4
        with:
          name: fehrust-windows-x86_64-setup
          path: installer/fehrust-*-windows-x86_64-setup.exe
